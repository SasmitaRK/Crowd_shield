[server]
headless = true

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#0d9488"
backgroundColor = "#f5f7fa"
secondaryBackgroundColor = "#eef2f6"
textColor = "#0f172a"
linkColor = "#0f766e"
borderColor = "#e3e8ef"
baseRadius = "10px"
showWidgetBorder = true
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, sans-serif"
headingFontWeights = [800, 700, 700, 650, 600, 600]
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap, monospace"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#8b5cf6", "#e4b30a"]

[theme.sidebar]
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#131d33"
textColor = "#c9d3e3"
borderColor = "#1e293b"
